[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-miner"
version = "0.1.0"
description = "VLM + 3D sensor/HD-map scenario mining and road-change detection on the Waymo Open Dataset"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "pydantic>=2.5",
    "duckdb>=1.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
label = ["streamlit>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
miner = "scenario_miner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scenario_miner = ["sql/*.sql", "taxonomy.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
